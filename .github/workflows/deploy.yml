name: Deploy Backend & Frontend

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build Backend on Runner
        run: |
          npm install
          npm run build

      - name: Pre-deployment - Sync source on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            cd ~/backend || { echo "❌ Backend directory not found!"; exit 1; }
            
            # Remove stale git lock if it exists
            [ -f .git/index.lock ] && rm -f .git/index.lock
            
            # 🔐 Backup .env before git operations
            [ -f .env ] && cp .env .env.bak
            
            # Force clean state on server (pulls latest source)
            git fetch origin main
            git reset --hard origin/main
            
            # 🔓 Restore .env if it was backed up
            [ -f .env.bak ] && mv .env.bak .env

      - name: Copy Build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "dist/*"
          target: "~/backend/dist"
          strip_components: 1

      - name: Post-deployment - Restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            cd ~/backend || { echo "❌ Backend directory not found!"; exit 1; }
            chmod +x scripts/deploy.sh
            # Use --skip-build because we already built on the runner
            ./scripts/deploy.sh --skip-build
