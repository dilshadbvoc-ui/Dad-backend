name: Deploy Backend & Frontend

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build Backend on Runner
        run: |
          npm install
          npx prisma generate
          npm run build

      - name: Pre-deployment - Sync source on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            cd ~/backend || { echo "❌ Backend directory not found!"; exit 1; }
            
            # Remove stale git lock if it exists
            [ -f .git/index.lock ] && rm -f .git/index.lock
            
            # 🔐 Backup .env before git operations
            [ -f .env ] && cp .env .env.bak
            
            # Force clean state on server (pulls latest source)
            git fetch origin main
            git reset --hard origin/main
            
            # 🔓 Restore .env if it was backed up
            [ -f .env.bak ] && mv .env.bak .env

      - name: Copy Build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "dist"
          target: "~/backend/"
          overwrite: true
          rm: true

      - name: Post-deployment - Restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            cd ~/backend || { echo "❌ Backend directory not found!"; exit 1; }
            
            # Install dependencies if needed
            if [ ! -d "node_modules" ]; then
              echo "📦 Installing dependencies..."
              npm install --ignore-scripts
            fi
            
            # Generate Prisma client if needed
            if [ ! -d "node_modules/.prisma" ] || [ ! -d "src/generated/client" ]; then
              echo "🗄️ Generating Prisma client..."
              npx prisma generate
            fi
            
            # Copy Prisma client to dist
            if [ -f "copy-prisma.js" ]; then
              node copy-prisma.js
            fi
            
            # Restart PM2
            echo "▶️ Restarting Backend API..."
            pm2 restart crm-api || pm2 start dist/index.js --name "crm-api"
            
            echo "✅ Deployment Complete!"
